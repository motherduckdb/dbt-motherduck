kind: Under the Hood
body: Connect with return_pg_command_tags=on so MotherDuck returns Postgres command tags with affected-row counts instead of DuckDB Count/Success results. The adapter response message is now the full tag (for example `UPDATE 2` instead of `UPDATE`), and MERGE reports code `MERGE` instead of `UNKNOWN`
time: 2026-11-11T12:00:00-08:00
custom:
  Issue: ECO-1302
