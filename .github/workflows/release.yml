name: Release

# Publishes the newest release notes in .changes once CI passes on the commit
# that has them, unless their version is already tagged. Prepare release opens
# the pull request that adds them. The package is built from that commit and
# published to PyPI, and the GitHub release creates the tag. hatch-vcs reads the
# package version from the tag, so the build tags the commit locally first, and
# nothing is tagged on GitHub until PyPI has the package. The tag is what marks a
# version as released, so rerunning a failed run picks up where it stopped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # Releasing from another branch needs it added here too.
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Only pushes to this repository: the branch filter matches pull requests from
  # forks whose branch has the same name.
  detect:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pending.outputs.version }}
      is-prerelease: ${{ steps.pending.outputs.is-prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Find latest release notes
        id: latest
        uses: miniscruff/changie-action@6dcc2533cac0495148ed4046c438487e4dceaa23 # v2.0.0
        with:
          version: v1.26.0
          args: latest
      # changie names prerelease notes like 0.2.0-a1, the PEP 440 version is 0.2.0a1.
      - name: Check for an unreleased version
        id: pending
        env:
          NOTES_VERSION: ${{ steps.latest.outputs.output }}
        run: |
          release_notes=".changes/$NOTES_VERSION.md"
          if [[ ! -f "$release_notes" ]]; then
            echo "::notice::No release notes, nothing to release."
            exit 0
          fi
          version="${NOTES_VERSION//-/}"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
            echo "::notice::$version is already released."
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$NOTES_VERSION" == *-* ]] && echo "is-prerelease=true" >> "$GITHUB_OUTPUT" || echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          echo "release-notes=$release_notes" >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"
          cat "$release_notes" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release notes
        if: steps.pending.outputs.version != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: ${{ steps.pending.outputs.release-notes }}
          if-no-files-found: error
          retention-days: 1

  build:
    needs: detect
    if: needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # hatch-vcs derives the package version from the tags in the history.
          fetch-depth: 0
      - name: Tag release commit locally
        run: git tag "$VERSION"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.10"
      - name: Install project
        run: uv sync --locked --no-default-groups
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uvx --from "twine>=7,<8" twine check dist/*
      - name: Check package version
        run: |
          built=$(uv run --no-sync python -c 'import importlib.metadata; print(importlib.metadata.version("dbt-motherduck"))')
          if [[ "$built" != "$VERSION" ]]; then
            echo "::error::Built $built instead of $VERSION."
            exit 1
          fi
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [detect, build]
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://pypi.org/project/dbt-motherduck/${{ needs.detect.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist/
      # Lets a rerun get past this step when only the GitHub release failed.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  github-release:
    needs: [detect, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist/
      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: notes/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.detect.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PRERELEASE: ${{ needs.detect.outputs.is-prerelease == 'true' && '--prerelease' || '' }}
        run: |
          # this also tags the release
          gh release create "$VERSION" dist/* $PRERELEASE \
            --notes-file notes/*.md \
            --target "$SHA" \
            --title "$VERSION"
