name: Ecosystem

# Checks the adapter against the third-party dbt packages people actually
# install. They are resolved from the dbt Hub at run time and pinned
# only to a major version on purpose: the point of this job is to notice when a
# new upstream release stops working, so the newest compatible version is the
# one worth testing. That also means this job can go red because of someone
# else's release, which is why it is not part of the pull request run.

on:
  schedule:
    # 03:30 UTC daily.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Separate from CI so a pull request run neither cancels this job nor is
  # cancelled by it. Not cancel-in-progress: a killed run skips the fixture
  # teardown that drops its generated database.
  group: ecosystem-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ecosystem:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DBT_ENV_SECRET_MOTHERDUCK_TOKEN: ${{ secrets.DBT_ENV_SECRET_MOTHERDUCK_TOKEN }}
      MOTHERDUCK_INITIAL_DATABASE: ${{ vars.MOTHERDUCK_INITIAL_DATABASE }}
      MOTHERDUCK_TEST_RUN_ID: >-
        ecosystem-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.10"
      - name: Install project and test dependencies
        run: uv sync --locked --no-editable
      - name: Report versions
        run: uv run --no-sync dbt --version
      # Only the native database type: these tests are about package SQL, and
      # running them twice would double the Hub traffic for no extra signal.
      - name: Run ecosystem tests
        run: uv run --no-sync pytest -m ecosystem -ra -n 4 --database-type native
      # Each project installs its own copy of dbt_packages; keeping them makes a
      # red run reproducible against the exact versions that were resolved.
      - name: Report resolved package versions
        if: always()
        run: find . -name package-lock.yml -not -path "./.venv/*" -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;

  notify-failure:
    name: Send Slack notification on failure
    if: failure() && github.event_name == 'schedule'
    needs: [ecosystem]
    runs-on: ubuntu-latest
    # The secrets context is not available to `if`, so route it through env.
    env:
      SLACK_WEBHOOK: ${{ secrets.MOTHERDUCK_CI_NOTIFICATION_WEBHOOK }}
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.MOTHERDUCK_CI_NOTIFICATION_WEBHOOK }}
          webhook-type: webhook-trigger
          payload: |
            {
              "text": "dbt-motherduck ecosystem run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
