name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Not cancel-in-progress: a killed integration run skips the fixture teardown
  # that drops its generated database.
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changelog: ${{ steps.paths.outputs.changelog }}
      package: ${{ steps.paths.outputs.package }}
      tests: ${{ steps.paths.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
      - name: Check changed paths
        id: paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        with:
          filters: |
            package:
              - 'src/**'
              - 'pyproject.toml'
            changelog:
              - 'added|modified: .changes/unreleased/*.yaml'
            tests:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  changelog:
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'skip:changelog-check')
    runs-on: ubuntu-latest
    steps:
      - name: Require a changelog entry
        if: needs.changes.outputs.package == 'true' && needs.changes.outputs.changelog != 'true'
        run: |
          echo "::error::Package changes require a YAML entry under .changes/unreleased."
          echo "Run 'changie new', or apply the skip:changelog-check label if release notes are not needed."
          exit 1

  lint:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install lint dependencies
        run: uv sync --locked --only-group lint
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Check lint rules
        run: uv run --no-sync ruff check .

  unit:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.tests == 'true'
    name: unit (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # Non-editable so the adapter is importable the way dbt discovers plugins:
      # it globs dbt/adapters/*/__version__.py under the installed namespace.
      - name: Install project and test dependencies
        run: uv sync --locked --no-editable
      - name: Report versions
        run: |
          uv run --no-sync dbt --version
          uv pip list
      - name: Run unit tests
        run: uv run --no-sync pytest -m unit

  integration:
    name: integration (${{ matrix.database-type }})
    needs: [changes, unit]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    # The native leg measured 1h20m against the live endpoint; leave headroom.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Both legs share one duckling, and the end-of-run sweep of DuckLake databases
      # can abort it (see the workaround in tests/conftest.py), so run one at a time.
      max-parallel: 1
      matrix:
        database-type: [native, ducklake]
    env:
      DBT_ENV_SECRET_MOTHERDUCK_TOKEN: ${{ secrets.DBT_ENV_SECRET_MOTHERDUCK_TOKEN }}
      MOTHERDUCK_INITIAL_DATABASE: ${{ vars.MOTHERDUCK_INITIAL_DATABASE }}
      # Names the disposable databases. Includes the matrix leg because both legs
      # of a run share a run number.
      MOTHERDUCK_TEST_RUN_ID: >-
        ${{ github.ref_name }}-${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.database-type }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.10"
      # The fixtures skip when the token is unset; in CI that must fail loudly instead.
      - name: Require endpoint credentials
        run: |
          [ -n "$DBT_ENV_SECRET_MOTHERDUCK_TOKEN" ] \
            || { echo "::error::secret DBT_ENV_SECRET_MOTHERDUCK_TOKEN is not set"; exit 1; }
          [ -n "$MOTHERDUCK_INITIAL_DATABASE" ] \
            || { echo "::error::variable MOTHERDUCK_INITIAL_DATABASE is not set"; exit 1; }
      - name: Install project and test dependencies
        run: uv sync --locked --no-editable
      - name: Report versions
        run: uv run --no-sync dbt --version
      - name: Run integration tests
        run: uv run --no-sync pytest -m integration -ra -n 8 --database-type ${{ matrix.database-type }}
