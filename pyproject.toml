[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dbt-motherduck"
version = "0.1.0.dev0"
description = "A dbt adapter for MotherDuck's PostgreSQL endpoint"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.12.5,<1.13",
    "dbt-adapters>=1.24.5,<2",
    "dbt-common>=1.37.5,<2",
    "psycopg[binary]>=3.3.6,<4",
    "sqlparse>=0.6,<1",
]

[dependency-groups]
test = ["pytest>=8,<10", "pytest-xdist>=3.8,<4", "dbt-tests-adapter>=1.20,<1.21"]
lint = ["ruff>=0.16.10,<1"]

[tool.uv]
default-groups = ["test", "lint"]

[tool.hatch.build.targets.wheel]
packages = ["src/dbt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "ecosystem: runs a third-party dbt package from the Hub against the adapter",
    "integration: requires a live MotherDuck PostgreSQL endpoint",
    "unit: does not require a database",
    "skip_database_type(*types, reason): excludes unsupported database types",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]
# Line length is left to the formatter, which cannot split long copied SQL fixtures.
ignore = ["E501"]
