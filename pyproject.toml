[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dbt-motherduck"
version = "0.1.0.dev0"
description = "A dbt adapter for MotherDuck's PostgreSQL endpoint"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.12.5,<1.13",
    "dbt-adapters>=1.24.5,<2",
    "dbt-common>=1.37.5,<2",
    "psycopg[binary]>=3.3.6,<4",
]

[dependency-groups]
test = ["pytest>=8,<10"]
lint = ["ruff>=0.14,<1"]

[tool.uv]
default-groups = ["test", "lint"]

[tool.hatch.build.targets.wheel]
packages = ["src/dbt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["integration: requires a live MotherDuck PostgreSQL endpoint"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
